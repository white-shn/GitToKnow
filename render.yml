service: git-to-know

env: python
plan: free

# Build settings
buildCommand: |
  pip install -r requirements.txt

# Start command
startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

# Environment variables (set these in the Render dashboard)
envVars:
  - key: CORS_ORIGINS
    value: http://localhost:5173,http://127.0.0.1:5173
  - key: GITHUB_TOKEN
    fromSecret: GITHUB_TOKEN
  - key: GEMINI_API_KEY
    fromSecret: GEMINI_API_KEY
  - key: GEMMA_MODEL
    value: gemma-4-26b-a4b-it
  - key: EMBEDDING_MODEL
    value: gemini-embedding-001
  - key: USE_MOCK_DATA
    value: "true"

# Service settings
healthCheckPath: /api/health
healthCheckTermination: auto

# Git configuration
git:
  branch: main